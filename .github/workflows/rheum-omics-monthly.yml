name: Rheum omics monthly report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rheum-omics-monthly.yml"
      - "rheum_omics_monitor/**"
  schedule:
    - cron: "0 1 1 * *"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_HOST: smtp.163.com
      SMTP_PORT: "465"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_LOGIN_USER: ${{ secrets.SMTP_LOGIN_USER }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile rheum_omics_monitor/monitor.py

      - name: Generate report only on push
        if: github.event_name == 'push'
        run: python rheum_omics_monitor/monitor.py --since-days 7 --include-seen

      - name: Validate email secrets
        if: github.event_name != 'push'
        shell: bash
        run: |
          missing=0
          for name in SMTP_USER SMTP_AUTH_CODE REPORT_TO_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            else
              echo "${name} is configured"
            fi
          done
          python - <<'PY'
          import os
          user = os.environ.get("SMTP_USER", "")
          auth_code = os.environ.get("SMTP_AUTH_CODE", "")
          recipient = os.environ.get("REPORT_TO_EMAIL", "")
          domain = user.split("@", 1)[1] if "@" in user else "missing-at-sign"
          print(f"SMTP_USER domain: {domain}")
          print(f"SMTP_AUTH_CODE length: {len(auth_code)}")
          print(f"REPORT_TO_EMAIL has at sign: {'@' in recipient}")
          print(f"SMTP_LOGIN_USER configured: {bool(os.environ.get('SMTP_LOGIN_USER'))}")
          PY
          echo "SMTP_HOST=${SMTP_HOST}"
          echo "SMTP_PORT=${SMTP_PORT}"
          exit "$missing"

      - name: Check SMTP login
        if: github.event_name != 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          user = os.environ["SMTP_USER"]
          auth_code = os.environ["SMTP_AUTH_CODE"]
          candidates = []
          if os.environ.get("SMTP_LOGIN_USER"):
              candidates.append(("SMTP_LOGIN_USER", os.environ["SMTP_LOGIN_USER"] ))
          candidates.append(("SMTP_USER", user))
          if "@" in user:
              candidates.append(("SMTP_USER local part", user.split("@", 1)[0]))
          last_error = None
          for label, login_user in candidates:
              try:
                  print(f"Trying SMTP login with {label}")
                  with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=60) as smtp:
                      smtp.login(login_user, auth_code)
                  print(f"SMTP login succeeded with {label}")
                  raise SystemExit(0)
              except smtplib.SMTPAuthenticationError as exc:
                  last_error = exc
                  print(f"SMTP authentication failed with {label}: code={exc.smtp_code!r}")
          raise SystemExit(f"All SMTP login attempts failed. Last error: {last_error}")
          PY

      - name: Send monthly report
        if: github.event_name != 'push'
        run: python rheum_omics_monitor/monitor.py --since-days 35 --send-email
