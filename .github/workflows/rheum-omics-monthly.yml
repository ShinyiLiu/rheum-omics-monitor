name: Rheum omics monthly report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rheum-omics-monthly.yml"
      - "rheum_omics_monitor/**"
  schedule:
    - cron: "0 1 1 * *"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.qq.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile rheum_omics_monitor/monitor.py

      - name: Generate report only on push
        if: github.event_name == 'push'
        run: python rheum_omics_monitor/monitor.py --since-days 7 --include-seen

      - name: Validate email secrets
        if: github.event_name != 'push'
        shell: bash
        run: |
          missing=0
          for name in SMTP_USER SMTP_AUTH_CODE REPORT_TO_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            else
              echo "${name} is configured"
            fi
          done
          python - <<'PY'
          import os
          user = os.environ.get("SMTP_USER", "")
          auth_code = os.environ.get("SMTP_AUTH_CODE", "")
          recipient = os.environ.get("REPORT_TO_EMAIL", "")
          domain = user.split("@", 1)[1] if "@" in user else "missing-at-sign"
          print(f"SMTP_USER domain: {domain}")
          print(f"SMTP_AUTH_CODE length: {len(auth_code)}")
          print(f"REPORT_TO_EMAIL has at sign: {'@' in recipient}")
          PY
          echo "SMTP_HOST=${SMTP_HOST}"
          echo "SMTP_PORT=${SMTP_PORT}"
          exit "$missing"

      - name: Check SMTP login
        if: github.event_name != 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          user = os.environ["SMTP_USER"]
          auth_code = os.environ["SMTP_AUTH_CODE"]
          print(f"Trying SMTP login to {host}:{port} with SMTP_USER")
          with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=60) as smtp:
              smtp.login(user, auth_code)
          print("SMTP login succeeded")
          PY

      - name: Send monthly report
        if: github.event_name != 'push'
        run: python rheum_omics_monitor/monitor.py --since-days 35 --send-email
